bot:
  bankroll: 27.0                # starting USDC
  paper: true                   # paper-trading mode (no real orders)
  log_level: INFO
  loop_interval_ms: 100         # scan cadence
  # Counter-trade mode: when true, every strategy entry leg is flipped
  # before submission (BUY -> SELL, SELL -> BUY). The bot fades its own
  # strategies. Reduce-only legs (TP/SL/timeout closes + greedy flatten
  # signals) are NEVER inverted — closes still close the actual position.
  # Override per-run with BOT_INVERT_SIGNALS=true|false.
  #
  # DEFAULT FALSE: the strategies in this codebase were *tuned* for
  # positive expectancy on Delta perps; inverting them turns +E into
  # -E - 2×fees per trade (you eat the strategy's edge in reverse AND
  # round-trip fees on every fire). Only flip to true if you have
  # measured the strategies' live edge yourself and it is actually
  # negative on your venue/market regime.
  invert_signals: false

risk:
  kelly_fraction: 0.25          # fraction of full Kelly (0.25 = quarter-Kelly)
  # Trade quantity = trade_size_fraction × buying_power (per trade), where
  #   buying_power = bankroll × leverage
  # For Delta perps at 50× leverage, a $20 bankroll has $1,000 of buying
  # power, and trade_size_fraction = 0.5 produces a $500-notional order
  # (~50 lots of a $10 perp like DOGEUSD) on $10 of margin.
  #
  # Set to 0.0 to fall back to "respect Kelly / strategy-emitted size, only
  # scale down to fit max_trade_fraction" (the legacy behaviour).
  trade_size_fraction: 0.50
  # Hard ceiling — clamps trade_size_fraction. Same leverage-aware semantics.
  # Must be >= trade_size_fraction.
  max_trade_fraction: 0.50
  # Per-market exposure cap, also scaled by leverage. On Delta @ 50× this is
  # 0.50 × bankroll × 50 of notional allowed in one symbol.
  #
  # INVARIANT: must be >= max_trade_fraction. Otherwise the per-market cap is
  # tighter than the per-trade cap and every single-market signal gets
  # rejected on its first attempt (cumulative would-be exposure beats the
  # per-market ceiling immediately). The settings loader emits a startup
  # warning when this invariant is violated.
  max_market_exposure: 0.50
  # Tighter drawdown stop. 50% was a "don't blow the account" guardrail;
  # 25% is a "this regime is not working, halt and let the user
  # investigate" guardrail. The brain's daily-loss circuit-breaker
  # below kicks in *before* this for a graceful halt on a single bad
  # session; this is the hard kill that protects against a series of
  # sessions all going wrong.
  max_drawdown: 0.25
  # Number of consecutive LOSING closed trades that triggers the
  # loss-streak cool-down. This is NO LONGER a permanent halt — the
  # bot pauses for ``loss_streak_cooldown_seconds`` and then resumes
  # automatically.
  #
  # Was 6 (way too tight for a scalper) → 15 → 150 000 (effectively
  # disabled while debugging) → 25. 25 is high enough that the brain's
  # per-strategy mute (max_strategy_loss_streak below) does the precise
  # work, and only a true bot-wide meltdown trips this safety. Setting
  # it back to a real value restores the "stop bleeding for 5 minutes
  # and let the market move on" reflex that used to gate revenge runs.
  max_consecutive_losses: 25
  # Cool-down duration when ``max_consecutive_losses`` trips. Long
  # enough for the market to move past whatever noise tagged us,
  # short enough that the bot recovers within the same session.
  loss_streak_cooldown_seconds: 300.0

execution:
  # Taker fee applied to every paper-exchange fill (and reported by live
  # exchanges from their commission field). Delta's taker fee is ~5 bps;
  # set non-zero so paper P&L models real fees AND the greedy autopilot's
  # TP math (round_trip_fees / bps target) matches what live trading
  # will actually produce. Override per-run with BOT_TAKER_FEE_BPS.
  taker_fee_bps: 5.0
  # Fallback slippage in bps used ONLY when the paper exchange has no
  # live book to walk (e.g. unit tests). In production paper-trading the
  # exchange walks the actual VWAP from the Delta book and ``LinearSlippageModel``
  # returns the book VWAP directly — the flat-bps path is dead code for
  # any real symbol. Keeping it at 2 bps (down from 10) so the rare
  # fallback case is in the same ballpark as real top-of-book on liquid
  # Delta perps; 10 bps consistently mis-priced strategy fixtures.
  default_slippage_bps: 2
  min_order_size_usd: 1.0
  order_timeout_seconds: 30

strategies:
  delta_perp_scalper:
    # DISABLED 2026-05-28 after live evidence proved the strategy's
    # edge model is structurally broken on the current venue/regime.
    # Five sessions of measurement:
    #
    #   signals=60  exec=9  rejected=51 (85% gate-rejection rate)
    #   avg edge claimed = 71.9 bps
    #   realised PnL    = -$1.51 over 9 trades = -17 bps/trade
    #   model error     = 89 bps (claimed +72, realised -17)
    #
    # Even the brain's TOP-FILTERED 15 % of fires (the ones that
    # cleared the 10 bps cost gate, the regime gate, the mute gate,
    # the post-loss cooldown, the daily-loss cap AND the exposure
    # cap) lost money. That means the strategy's z-score + OFI signal
    # is anti-predictive on Delta perps right now — not a calibration
    # bug, a sign-of-edge bug. No amount of additional filtering can
    # fix a strategy that's correctly identifying entries which then
    # do the OPPOSITE of what the model says.
    #
    # The lifetime-PnL kill switch at -$3 would have caught this in
    # the next 2-3 trades anyway, but we're shutting it off
    # pre-emptively to stop the ongoing $0.17/trade bleed.
    #
    # To re-enable: run the training pipeline against the most
    # recent 30 days of data, retrain the OFI / z-score thresholds,
    # and only flip back on after the backtest shows positive
    # expectancy net of 22 bps of round-trip costs.
    enabled: false
    min_edge: 0.002
    zscore_window: 60
    # Tightened: 2.0 -> 2.5 (require deeper mean-reversion gravity)
    # and 0.2 -> 0.35 OFI (stronger order-flow confirmation in the
    # reversion direction). Fewer fires, higher edge per fire.
    zscore_entry: 2.5
    ofi_threshold: 0.35
    # Reference notional emitted on each fire. In target mode
    # (risk.trade_size_fraction > 0) the executor REPLACES this with
    # `trade_size_fraction × buying_power`, so this value mostly matters for
    # legacy mode. Set it high enough that the executor's cap is the real
    # constraint, not this.
    notional_usd: 1000.0
    min_depth_contracts: 1.0
    rearm_distance_bps: 5.0
    # Take-profit / stop-loss as a fraction of entry mid. 0 disables.
    # Sized as a SAFETY NET that sits slightly wider than the greedy
    # autopilot's bps-of-notional TP/SL (40 / 20 bps) so greedy normally
    # closes first. If greedy is disabled, these become the only exits
    # and the same 50 bps TP / 30 bps SL keeps the risk/reward sensible
    # for a mean-reversion scalp on liquid Delta perps.
    take_profit_pct: 0.005   # +50 bps from entry mid
    stop_loss_pct: 0.003     # -30 bps from entry mid
    # Absolute-USD P&L thresholds — DISABLED on this strategy.
    # These were the cause of the "6 % win rate" failure: $5 TP /
    # $3 SL is unreachable at sub-$200 notional (the 4 % price move
    # required on $125 won't happen inside the hold window), so every
    # trade timed out with a tiny noise-driven loss. The bps mode in
    # greedy now handles notional-scaling exits; this strategy keeps
    # the pct fallback above. Set both to > 0 only if you've reasoned
    # about what notional they apply to.
    take_profit_usd: 0.0
    stop_loss_usd: 0.0

  order_book_sniper:
    # HFT depth-imbalance scalper. Designed for taker-fee zero / rebate
    # venues — the spec's 5 bps TP can't clear a 10 bps round-trip taker
    # fee even at 100 % win rate, so on Delta this is a pure entry-timing
    # strategy and greedy drives the exits via its bps-of-notional ladder
    # (40 / 20 bps). Strategy-level TP / SL kept at 0 so they never
    # undercut greedy (a 5 bps strategy TP would fire long before
    # greedy's 40 bps target and lock in a fee-dominated loss).
    enabled: true
    # Raised 5 → 20 bps. Must clear the 10 bps round-trip taker fee
    # plus 2 bps slippage with a 5 bps safety buffer (brain enforces
    # the floor via ``min_edge_after_costs_bps`` too, but the
    # strategy-side gate keeps low-edge fires out of the pipeline
    # entirely instead of relying on the brain to drop them).
    min_edge: 0.0020
    imbalance_ratio: 3.0
    imbalance_band_bps: 10.0
    imbalance_max_levels: 10
    tape_min_count: 3
    tape_window_seconds: 2.0
    notional_usd: 1000.0
    # Strategy-side exits DISABLED — greedy bps mode owns the close.
    take_profit_pct: 0.0
    stop_loss_pct: 0.0
    take_profit_usd: 0.0
    stop_loss_usd: 0.0
    max_hold_seconds: 30.0     # safety timeout if greedy somehow misses
    # Spoofing defense: if the entry-side wall shrinks > spoof_vanish_ratio
    # within spoof_persist_seconds of entry and the wall was at least
    # spoof_min_wall_contracts, market-exit regardless of P&L.
    # spoof_min_wall_contracts=0 means "check every wall"; set to e.g. 50 to
    # only protect against BTC-style mega walls.
    spoof_min_wall_contracts: 0.0
    spoof_persist_seconds: 1.0
    spoof_vanish_ratio: 0.5
    # Limit-order placement: best_bid + N ticks for buys (best_ask − N for
    # sells). Uses the market's minimum_tick from Delta product metadata.
    entry_tick_offset: 1
    rearm_distance_bps: 3.0

  bid_ask_spread_fade:
    # Market-making lite. Posts simultaneous BUY + SELL limit quotes
    # inside the spread, captures a fraction of the spread as carry,
    # holds inventory near flat. THE ONLY strategy in this codebase
    # that pays Delta's MAKER fee (~2 bps) instead of the taker fee
    # (~5 bps) — break-even win rate ~55% vs ~62-78% for the takers.
    #
    # The strategy stamps ``time_in_force="gtc", post_only=True`` on
    # every emitted leg so its quotes rest on the book regardless of
    # the exchange-level default (which stays IOC for the other six
    # strategies' aggressive entries and closes). See
    # ``aera/strategies/bid_ask_spread_fade.py::_build_quote_signal``
    # and ``aera/execution/delta_exchange.py::DeltaLiveExchange.submit``
    # for the per-leg override path.
    enabled: true
    min_edge: 0.0004
    # Only quote when current spread / mid >= 0.03% (per spec).
    # Anything tighter cannot clear two maker fees + net-edge target.
    min_spread_pct: 0.0003
    # Capture 60% of the spread (the inner 60%, mid ± 30% of spread).
    capture_target: 0.60
    # Reference notional emitted per side. To get verbatim $5 quotes
    # on a small bankroll set risk.trade_size_fraction = 0 (legacy
    # mode) so the executor doesn't rescale up to the target.
    quote_size_usd: 5.0
    # Hard cap on absolute inventory notional (USD). Past this, the
    # offending side stops quoting.
    max_inventory_usd: 15.0
    # Past this, quotes are shifted to bias offloading (skew).
    inventory_skew_threshold_usd: 10.0
    inventory_skew_ticks: 1
    # Re-quote cadence (the engine's scan loop runs faster than this).
    refresh_rate_ms: 500.0
    # Volatility kill switch: 0.08% peak-to-trough move inside 5s
    # suspends quoting until the move drops out of the window.
    kill_move_pct: 0.0008
    kill_window_seconds: 5.0
    # Fee math. Delta's maker fee is 0.02% — net edge after two maker
    # fees must clear 0.04% before the strategy quotes.
    maker_fee_bps: 2.0
    min_net_edge_bps: 4.0
    # Spec asks for 1x leverage on this strategy. Set to null to
    # inherit the venue leverage instead.
    leverage_override: 1.0

  flow_scalp:
    # Tape Reading Momentum (Flow Scalp). HFT taker-flow scalper.
    # Detects a single market order ≥ N× the rolling 100-trade average
    # size, waits for confirmation prints, then front-runs the
    # continued flow at the touch. Strategy-side TP / SL disabled so
    # greedy bps mode owns the exits — the spec's 8 bps TP can't beat
    # 10 bps round-trip taker fees, identical to order_book_sniper.
    enabled: true
    # Raised 8 → 20 bps. Same reasoning as order_book_sniper: any fire
    # below the 10 bps RT fee + 2 bps slippage floor is negative-EV
    # before the strategy's edge even has a chance to play out.
    min_edge: 0.0020
    # Whale detection: tightened 5.0 → 6.5 and confirm_count 1 → 2
    # so we ride a clearer whale plus two same-direction follow-ups
    # rather than every random fat print.
    whale_multiple: 6.5
    confirm_multiple: 2.0
    confirm_count: 2
    confirm_window_seconds: 3.0
    avg_window: 100
    tape_max_trades: 500
    notional_usd: 1000.0
    # Strategy-side exits DISABLED — greedy bps mode owns the close.
    take_profit_pct: 0.0
    stop_loss_pct: 0.0
    trailing_stop_pct: 0.0
    take_profit_usd: 0.0
    stop_loss_usd: 0.0
    # Whale flow doesn't persist — strategy still bails after 60 s even
    # if greedy hasn't fired yet. Pure safety net.
    max_hold_seconds: 60.0
    rearm_distance_bps: 5.0
    # Spec asks for 5× leverage. Set to null to inherit the venue's
    # account leverage (markets.delta.leverage) instead.
    leverage_override: 5.0
    # Keep true while running off Delta's REST/WS book feed only.
    # Flip to false and call FlowScalp.record_trade() externally when
    # subscribing to a real trades-channel feed.
    auto_infer_from_book: true

  micro_vwap_sniper:
    # Micro VWAP Reversion Sniper. Fades short-term deviations from a
    # 1-min rolling micro-VWAP when aggressor volume drops off — a
    # classic "exhaustion fade" pattern on liquid perps.
    enabled: true
    # Raised 5 → 20 bps to keep fires above the 10 bps RT taker fee
    # floor. The 12 bps ``deviation_pct`` gate below already implies
    # most signals carry well over 20 bps of expected reversion, so
    # this only prunes the marginal low-edge tail.
    min_edge: 0.0020
    vwap_window_seconds: 60.0
    deviation_pct: 0.0012     # 12 bps deviation gate
    # Volume drop-off: short-window per-second rate must be < ratio_max
    # of the long-window per-second baseline (= exhausted aggressors).
    volume_short_seconds: 10.0
    volume_long_seconds: 300.0
    volume_ratio_max: 0.70
    notional_usd: 1000.0
    # Strategy-side exits DISABLED — greedy bps mode owns the close so
    # this strategy is a pure entry-timing signal. The original 7 bps TP
    # was below the 10 bps round-trip fee, guaranteeing a fee-dominated
    # loss on every "TP hit".
    take_profit_pct: 0.0
    tp_extra_bps: 0.0
    stop_loss_pct: 0.0
    take_profit_usd: 0.0
    stop_loss_usd: 0.0
    # Hold timeout — spec 15–90 s. Stays as a safety net if greedy
    # somehow misses the close.
    max_hold_seconds: 90.0
    # Spread guard: skip when spread / mid exceeds this fraction.
    # Spec: 0.0005 = 0.05%. 0 disables.
    max_spread_pct: 0.0005
    # Skip the first 5 minutes of every wall-clock hour (the rolling
    # VWAP buffer drains across the hour boundary and produces false
    # deviations).
    hour_skip_seconds: 300.0
    # Spec asks for 5x leverage. null = inherit from venue.
    leverage_override: 5.0
    rearm_distance_bps: 3.0

  stop_hunt_reversal:
    # Stop Hunt / Liquidity Grab Reversal. Detects engineered stop-hunt
    # wicks — sudden 0.15%+ spikes below a recent swing low (bullish
    # sweep) or above a recent swing high (bearish sweep) that close
    # back inside the level on the same 1s candle. Fades the sweep,
    # riding the snap-back with a partial TP at +0.10% (60% of size),
    # final TP at +0.20%, and a wick-anchored hard stop at the wick
    # low − 0.08% (mirror for shorts). Spec: BTC-PERP / ETH-PERP,
    # low-liquidity windows preferred.
    #
    # Disabled: produced 0 fires over 13k iterations. Engineered
    # 0.15% wicks are rare structural events and Delta India during
    # the test window had no clean sweep candles. Re-enable for
    # Asian session or weekend chop where they're more common.
    enabled: true
    min_edge: 0.0015
    # 1-second OHLC bars per spec. Raise to e.g. 5 for noisier
    # higher-timeframe sweeps (be sure to widen recovery_seconds).
    bar_seconds: 1.0
    max_bars: 300
    # Swing-pivot detection on the trailing minute (60 bars × 1s).
    # 5-bar fractal (strength=2 each side) matches the canonical
    # "swing high/low" definition; the latest 3 levels are kept.
    swing_lookback_bars: 60
    swing_pivot_strength: 2
    swing_count: 3
    # Sweep gates (per spec):
    #   wick depth ≥ 0.15%, body < 30% of range, recovers < 3s,
    #   wick volume ≥ 1.5× avg of the prior 30 bars.
    wick_size_pct: 0.0015
    body_ratio_max: 0.30
    recovery_seconds: 3.0
    volume_multiple: 1.5
    volume_lookback_bars: 30
    # Delta confirmation: bearish sweeps want "delta flips red"
    # (= net selling pressure on the wick close). bullish sweeps
    # mirror. Flip require_delta_confirmation to false if your
    # book-inference noise is too high to read clean delta.
    require_delta_confirmation: true
    delta_flip_threshold: 0.0001
    # Exit ladder per spec.
    take_profit_pct: 0.0020      # TP2 — +0.20%
    tp1_pct: 0.0010              # TP1 — +0.10%
    tp1_fraction: 0.60           # close 60% at TP1, 40% remains for TP2
    stop_extra_pct: 0.0008       # SL = wick_low − 0.08% (mirror for shorts)
    stop_loss_pct: 0.0           # entry-mid % fallback; 0 disabled
    take_profit_usd: 0.0
    stop_loss_usd: 0.0
    # Stale snap-backs decay into trend trades; flatten at 60s.
    max_hold_seconds: 60.0
    # Spec asks for 5× max leverage. null = inherit venue leverage.
    leverage_override: 5.0
    notional_usd: 1000.0
    rearm_distance_bps: 5.0

  tick_reversal_scalp:
    # HFT tick-exhaustion fade. Mid-frequency scalper that fades a
    # multi-tick directional run when per-tick volume decays and an
    # S/R level is being tested.
    enabled: true
    # Raised 4 → 20 bps. The original 4 bps floor was the single
    # biggest contributor to the "81% loss rate" failure mode: every
    # fire at the strategy's low-edge tail (4-10 bps) closed at a
    # guaranteed fee-driven loss because round-trip taker fees alone
    # were 10 bps. tick_reversal was the largest bleeder per session
    # (avg -18 bps per trade ≈ -SL hit + fees) until this was fixed.
    min_edge: 0.0020
    # Tightened 5 → 6: require a longer exhaustion run for higher
    # mean-reversion probability.
    min_streak: 6
    max_buffer_ticks: 200
    # Tightened 0.20 → 0.35: stronger exhaustion of the initiating
    # side before fading.
    size_decay_threshold: 0.35
    sr_band_bps: 5.0
    sr_lookback_ticks: 50
    require_depth_trend: true
    # Skip filters — wide spread, news spike, volume spike.
    max_spread_multiple: 3.0
    spread_ema_alpha: 0.05
    volume_spike_multiple: 5.0
    volume_short_window_seconds: 5.0
    volume_long_window_seconds: 60.0
    news_lookback_seconds: 60.0
    news_max_tick_bps: 50.0
    notional_usd: 1000.0
    entry_offset_bps: 0.0
    # Strategy-side exits DISABLED — greedy bps mode owns the close.
    # The spec's 4 bps TP was below 10 bps round-trip taker fees so
    # every "TP hit" closed at a guaranteed loss; greedy's 40 bps TP
    # actually pays out.
    take_profit_pct: 0.0
    stop_loss_pct: 0.0
    take_profit_usd: 0.0
    stop_loss_usd: 0.0
    # Hard hold timeout — stale reversals decay into trend trades.
    max_hold_seconds: 30.0
    rearm_distance_bps: 3.0

  money_printer:
    # MoneyPrinter — the backtest-trained adaptive strategy.
    #
    # OFF by default until you've run the offline training pipeline:
    #
    #     python -m scripts.fetch_history  --symbols BTCUSD,ETHUSD,SOLUSD --days 30
    #     python -m scripts.sweep_backtest --symbols BTCUSD,ETHUSD,SOLUSD --days 30
    #     python -m scripts.train_money_printer
    #
    # The first command pulls 30 days of 1m candles into
    # ``data/history/``. The second backtests every strategy on
    # every symbol and writes ``data/money_printer/hour_maps.json``
    # (UTC hours where each (strategy, symbol) was profitable).
    # The third trains the ProfitabilityClassifier and writes
    # ``data/money_printer/model.joblib``. Once those two files
    # exist, flip ``enabled: true`` and restart.
    enabled: true
    bar_seconds: 60                       # aggregate ticks into 1-minute bars
    feature_window_bars: 200              # ~3 hours of warm-up history
    win_threshold: 0.55                   # only fire when model says P(win) >= 0.55
    hour_map_path: data/money_printer/hour_maps.json
    model_path: data/money_printer/model.joblib
    min_atr_pct: 0.0005                   # skip when 14-bar ATR < 5 bps
    max_atr_pct: 0.03                     # skip when 14-bar ATR > 3% (news)
    tp_atr_mult: 1.5                      # TP = 1.5 x ATR (volatility-adaptive)
    sl_atr_mult: 1.0                      # SL = 1.0 x ATR
    max_hold_seconds: 1800                # 30-min force-flatten
    notional_usd: 100.0                   # baseline; scaled by model confidence
    leverage_hint: 25.0

markets:
  delta:
    # 25x = balanced: $100 bankroll × 25x = $2500 buying power → with
    # compound_fraction=0.20 below this targets ~$500 notional per trade.
    # A 0.5% adverse move = $2.50 (= ~symmetric with the $1.50 SL below
    # at 30 bps adverse, well clear of ordinary bid-ask noise).
    # 100x was deliberately tighter and bled to spread/noise on every fire.
    leverage: 25
    # Symbols to subscribe to. Each one is auto-discovered from /v2/products,
    # so contract_value, max_leverage, and margin% are pulled from Delta;
    # we just have to name them here. Cheap-contract coins (XRPUSDT, DOGEUSDT)
    # are excellent paper-trading playgrounds because 1 contract is small
    # enough to fit a tiny bankroll without overshoot.
    symbols:
      - ETHUSD       # 1 contract ≈ $21   (works on $20 bankroll)
      - XRPUSD       # 1 contract ≈ $1.3  (works on $20 bankroll)
      - DOGEUSD      # 1 contract ≈ $10   (works on $20 bankroll)
      - SOLUSD       # 1 contract ≈ $84   (needs overshoot ≥ 45 OR bankroll ≥ $100)
      - BTCUSD       # 1 contract ≈ $76   (needs overshoot ≥ 40 OR bankroll ≥ $100)

    # With bankroll=$20, leverage=50x, and trade_size_fraction=0.5 the
    # executor sizes each Delta leg to ~$500 of notional (= 50% of buying
    # power). At that scale every Delta symbol fits in plenty of contracts,
    # so contract-overshoot is no longer the dominant constraint:
    #   ~50 lots of DOGE  ($10/lot)   = $500  (perfect fit)
    #   ~24 lots of ETH   ($21/lot)   = $504
    #   ~385 lots of XRP  ($1.3/lot)  = $500
    # min_trade_notional_usd is the venue's per-order floor (Delta's typical
    # min is $1 of notional); overshoot only bites for sub-$1-per-contract
    # symbols which Delta doesn't offer.
    min_trade_notional_usd: 1.0
    # Reject a trade if the 1-contract-minimum overshoots the intended
    # notional by more than this multiple. Keep at 1.5 (50% slack) once
    # sizing is leverage-aware — the only path to overshoot is now if the
    # intended notional itself collapses below 1 contract, which would be
    # a config bug worth surfacing rather than papering over.
    max_notional_overshoot: 1.5

simulation:
  monte_carlo_runs: 1000
  default_edge: 0.0004          # 4 bps average edge per trade
  default_win_rate: 0.535
  default_payoff_ratio: 1.0     # symmetric +1 / -1 unit

greedy:
  # Greedy autopilot — overrides per-trade TP/SL and leverage so the bot
  # targets a small, *bps-of-notional* profit, rides winners with a
  # trailing ratchet, and stair-steps leverage up on win streaks.
  # Compounds aggressively by deploying a fixed fraction of buying power
  # on every fresh entry.
  enabled: true

  # ---- bps-of-notional TP / SL (post-2026-05 default) ----------------
  # These OVERRIDE the absolute-USD knobs below when > 0. The whole
  # point of bps mode is that the required PRICE-MOVE % to trigger an
  # exit stays constant regardless of how much the compounding sizer
  # actually opens — so a trade sized to $125 has the same exit
  # behaviour as one sized to $2000.
  #
  # The previous absolute-USD mode (min_profit_usd=3, initial_sl_usd=3
  # on a calibration of $2000 notional) was the root cause of the
  # "printed losses only" failure: with compound_fraction=0.05 on a
  # $100 bankroll the actual notional was ~$125, so the $5 TP target
  # required a +4 % BTC move and the $3 SL required −2.4 %. Neither
  # was reachable inside the 120 s hold window, so every trade
  # timed out at a random nearby price with a slight loss skew from
  # spread + fee drag (avg PnL/trade = -$0.10 ≈ 9 bps × $125).
  #
  # Math at the new defaults (taker_fee_bps=5 ⇒ 10 bps RT, slippage
  # 0 bps when book VWAP is available):
  #
  #     TP = 40 bps gross  ⇒ net realised win  = +30 bps after fees
  #     SL = 20 bps gross  ⇒ net realised loss = −30 bps after fees
  #     break-even win rate ≈ 50 %    (achievable for a z-score MR scalp)
  #
  # Set both to 0 to revert to the legacy USD mode (min_profit_usd /
  # initial_sl_usd / extend_tp_step_usd / trailing_giveback_usd take
  # over). bps mode is strongly recommended for any compounding sizer.
  tp_bps: 40.0
  sl_bps: 20.0
  extend_tp_step_bps: 10.0        # roll TP forward by 10 bps on each cross
  # Tightened 8 → 5 bps: once the ratchet engages (now at 28 bps profit
  # per lock_in_trigger_ratio), it locks in tighter. 8 bps was letting
  # winners give back almost half their lead in a single tick; 5 bps
  # keeps the locked-in profit at peak − 5 bps so a 28 bps peak closes
  # at +23 bps gross = +13 bps net = $0.16 on a $125 notional, more
  # than double the previous $0.07 average win.
  trailing_giveback_bps: 5.0      # give back at most 5 bps from the peak

  # ---- legacy absolute-USD TP / SL (FALLBACK) ------------------------
  # Used only when ``tp_bps == 0`` / ``sl_bps == 0``. Kept for backward
  # compat with calibrated fixed-notional setups (e.g. a paper account
  # that always trades exactly $2000 per leg). Leave these at sensible
  # values so a single config-edit toggles the modes cleanly.
  min_profit_usd: 3.0
  fee_pad_multiple: 1.0
  extend_tp_step_usd: 1.0
  initial_sl_usd: 3.0
  trailing_giveback_usd: 1.0

  # ---- trailing ratchet ----------------------------------------------
  # Tightened 0.50 → 0.70: ratchet only engages once profit has cleared
  # 70 % of the TP target (≈ 28 bps on the 40 bps TP). Live evidence
  # showed avg win was only $0.07 vs avg loss $0.23 — the ratchet was
  # clipping winners at +12-17 bps net while losers ran to full -23 bps.
  # At 0.70 the ratchet still locks in genuinely strong runs but stops
  # cutting off "almost made it to TP" trades that would otherwise
  # average $0.20+ wins.
  lock_in_trigger_ratio: 0.70     # start ratcheting at 70 % of TP target
  max_hold_seconds: 120.0         # hard exit if neither TP/SL fires

  # ---- greedy leverage (per fresh entry) -----------------------------
  # Fixed 25× leverage. min == max so every entry is sized against
  # bankroll × 25× of buying power; leverage_step=0 disables the win-
  # streak ramp so leverage stays exactly 25× trade after trade.
  # respect_venue_cap below clamps this back to the per-symbol max if
  # the venue refuses 25× for some symbol.
  min_leverage: 25.0
  max_leverage: 25.0
  leverage_step: 0.0
  respect_venue_cap: true

  # ---- compounding ----------------------------------------------------
  # Replaces risk.trade_size_fraction when greedy is on. With $100
  # bankroll × 25× × 0.05 = $125 notional per trade. We pulled this
  # back from 0.10 → 0.05 to halve absolute-dollar risk while the
  # cost-aware edge gate (brain.min_edge_after_costs_bps) and
  # tighter mute thresholds (max_strategy_loss_streak=3,
  # min_trades_for_eval=5) prove out on real fills. Once a
  # multi-hour session prints positive expectancy at 5 % size, bump
  # back toward 0.10 in steps.
  compound_fraction: 0.05
  # Hard ceiling on per-trade notional (USD). Less critical in bps mode
  # because thresholds scale, but still useful as a "single trade can't
  # be larger than this" guard at very large bankrolls. $2000 keeps the
  # paper-trading math identical to live for small accounts. 0 disables.
  max_notional_usd: 2000.0
  # When > 0, override execution.taker_fee_bps for the legacy-mode TP
  # math only. Has no effect in bps mode (the bps target is independent
  # of fee estimates). Useful if the venue's reported fee differs from
  # the paper config.
  fee_override_bps: 0.0

brain:
  # Adaptive Brain — live edge tracker + regime router + circuit-breakers.
  # The brain sits between the strategies and the executor (after greedy)
  # and applies vetoes / size shrinks to fresh entries based on:
  #   1. Per-strategy live performance (mutes losing strategies for
  #      mute_seconds, returns them on probation at half size).
  #   2. Per-symbol regime (RANGE / TREND_UP / TREND_DOWN / HIGH_VOL /
  #      NEWS_SPIKE). Mean-reversion strategies only fire in RANGE,
  #      flow_scalp only in TREND_*; NEWS_SPIKE vetoes everything.
  #   3. Daily rolling realised PnL — if it drops below
  #      daily_loss_pct × bankroll, all entries pause for the rest of
  #      the 24h window.
  #   4. Gross long / short exposure cap across all symbols.
  #
  # Reduce-only legs (TP/SL closes, greedy flattens) ALWAYS flow
  # regardless of brain state — the brain only ever shrinks or
  # vetoes fresh entries. Override per-run with BOT_BRAIN=true|false.
  enabled: true
  # ---- per-strategy performance gate ------------------------------
  # Minimum closed round-trips before the win-rate / expectancy gates
  # are evaluated. Below this the strategy fires at full size.
  # Tightened 10 → 5: at 10 a strategy could bleed ~$3 before being
  # mute-eligible (live evidence: tick_reversal_scalp lost -$3.30 on
  # 9 trades while still under min_trades_for_eval). At 5 the same
  # strategy would have been evaluated halfway in and muted, capping
  # the bleed at ~$1.50.
  min_trades_for_eval: 5
  # Rolling depth of the per-strategy PnL window.
  perf_window: 30
  # Mute the strategy if rolling win-rate < min_win_rate OR
  # rolling expectancy < min_expectancy_usd.
  # Raised 0.40 → 0.45: with greedy bps mode (40/20 bps TP/SL +
  # 10 bps round-trip fees), the random-walk break-even WR is ~50 %.
  # A strategy stuck below 45 % over 5+ trades has provably worse
  # entries than coin-flip and should be paused.
  min_win_rate: 0.45
  min_expectancy_usd: 0.0
  # Hard mute on N consecutive losses regardless of rolling stats.
  # Was 4 → 2 → 4 → 3. Three losses in a row is a strong enough
  # statistical signal (p ≈ 12.5 % under a fair coin) that the
  # strategy's current setup isn't paying. Setting to 2 made the
  # bot mute every strategy in minutes (during the broken USD-TP
  # era) so we don't go that far; 3 is the sweet spot.
  max_strategy_loss_streak: 3
  # Cooldown when a mute fires.
  mute_seconds: 600.0
  # Per-(strategy, symbol) cool-down after a losing close. The brain
  # refuses new entries on the same pair for this many seconds. This
  # is the single biggest fix for "lost six in a row in six minutes"
  # — the bot was instantly re-entering the same losing pattern on
  # the same market. 60s is short enough that real reversion signals
  # still fire on the next setup, but long enough that the immediate
  # noise that stopped us out has moved on. 0 disables.
  post_loss_cooldown_seconds: 60.0
  # Probation: after the mute window the strategy re-engages at
  # ``probation_size_mult`` until it completes ``probation_trades``
  # additional trades with non-negative average PnL — then it
  # graduates back to 1.0 size.
  probation_trades: 5
  probation_size_mult: 0.5
  # ---- regime detector tunables -----------------------------------
  # Loosened from the initial defaults — micro-tick drift
  # consistently classified as TREND_* on real Delta data, which
  # vetoed every mean-reversion fire on the first day. We pulled
  # this back to 0.40 (was 0.60): mean-reversion strategies were
  # firing into mild trends and losing systematically (live evidence:
  # delta_perp_scalper -$2.27 / 13 trades on a TREND_UP regime that
  # the loose 0.60 threshold classified as RANGE). 0.40 catches mild
  # trends; |drift / vol| > 0.40 is the TREND_* threshold.
  regime_short_window: 30
  regime_long_window: 300
  regime_trend_threshold: 0.40   # |drift / vol| → TREND_* above this
  regime_high_vol_ratio: 2.5     # short-ATR / long-ATR → HIGH_VOL above
  regime_news_tick_bps: 35.0     # single-tick move > N bps → NEWS_SPIKE
  # Flipped to HARD-veto: wrong-regime entries are dropped, not just
  # shrunk. ``regime_soft_veto: true`` was producing systematic losses
  # on mean-reversion strategies in TREND_* regimes because half-size
  # losses still bleed and the perf gate took too long to mute (needs
  # at least min_trades_for_eval=5 closed trades; in a fast TREND the
  # bot can rack up half-a-dozen losses in 2 minutes). Hard veto
  # short-circuits the bleed: no fire = no loss.
  regime_soft_veto: false
  wrong_regime_size_mult: 0.5    # only used if regime_soft_veto: true
  high_vol_size_mult: 0.5        # shrink size by half in HIGH_VOL regime
  # ---- circuit-breakers -------------------------------------------
  # Pause entries when 24h rolling realised PnL ≤ -daily_loss_pct ×
  # bankroll. Tightened 0.10 → 0.06. The previous 10 % cap let the
  # bot bleed for ~20 minutes before halting; 6 % gives us ~10 min
  # of bad-regime exposure before flatten-out kicks in, which is a
  # smaller hole to climb out of and a faster signal that the
  # current strategy mix isn't working in the live regime.
  daily_loss_pct: 0.06
  daily_window_seconds: 86400.0
  # Per-side gross-notional cap = max_gross_exposure_mult × bankroll
  # × leverage. With default 2.0 and a $100 bankroll on 25× perps,
  # the cap is $100 × 25 × 2.0 = $5,000 of notional — ≈ 13 concurrent
  # $375 scalps before the brain says "enough". Tightened 2.0 → 1.0
  # to halve fee burn during noisy regimes: at $100 bankroll × 25× ×
  # 1.0 = $2500 per-side cap, ~10 concurrent $250 scalps. Still way
  # more than the bot typically opens (5 in a busy session) but cuts
  # the worst-case all-strategies-fire-at-once scenario in half.
  max_gross_exposure_mult: 1.0

  # ---- lifetime PnL kill switch -----------------------------------
  # Once a strategy's cumulative realised PnL drops below this floor,
  # it is HARD-muted for the rest of the process — no probation, no
  # auto-revival, no second chances. Different from the rolling-window
  # mute (max_strategy_loss_streak / min_win_rate) which times out
  # after ``mute_seconds`` and lets the strategy cycle through
  # probation indefinitely.
  #
  # Live evidence: a single broken strategy (delta_perp_scalper in
  # TREND_UP regimes) could lose $0.20-$0.30 per fire, get muted at
  # streak=3, return on probation after 10 min, lose 2-3 more on
  # half-size, get re-muted, repeat. Cumulative bleed compounds even
  # though each individual mute cycle "looked OK". The lifetime
  # kill switch ends the cycle once total damage exceeds the floor.
  #
  # Default -$10 on a $100 bankroll = 10 % of starting equity per
  # strategy max bleed. Tighter (e.g. -$3) is more conservative but
  # may kill strategies that were just unlucky early. Set to 0 to
  # disable entirely.
  lifetime_pnl_kill_floor_usd: -3.0

  # ---- cost-aware edge floor --------------------------------------
  # Vetoes any fresh entry whose claimed edge minus round-trip taker
  # fees and assumed slippage doesn't clear ``min_edge_after_costs_bps``.
  # This is the single biggest fix for "bot lost money even with
  # working TP/SL": four of seven strategies shipped with min_edge
  # below the 10 bps round-trip taker fee, so every fire at the
  # low-edge tail was a guaranteed loss. The brain enforces this
  # globally so new strategies inherit the floor automatically.
  #
  # Tightened 5 → 10 bps after live evidence: at 5 bps floor the bot
  # was still firing on marginal signals (8 losing trades in 44 min
  # at -$0.23 avg) and the small-but-real edge wasn't enough to clear
  # fees + slippage + the random-walk bias. At 10 bps floor the
  # required gross edge is now:
  #   RT fee (10) + slippage (2) + floor (10) = 22 bps gross edge.
  # That's the same threshold the ``delta_perp_scalper`` strategy
  # spec asks for (min_edge=20 bps + a small buffer), so only
  # signals at the strategy's high-confidence tail will pass.
  #
  # Set to 0 to disable (legacy "trust the strategy's own min_edge"
  # behaviour). Reduce-only legs always flow.
  min_edge_after_costs_bps: 10.0
  cost_round_trip_legs: 2
  cost_assumed_slippage_bps: 2.0
